[package]
org = "oresoftware"
name = "ores-locks-and-leases"
version = "0.1.1"
description = "Composed distributed locking for the fleet: a fiducia-cloud lease around a Postgres advisory lock (transaction- or session-scoped), each layer switchable, with full-width fencing-token decisions and atomic PostgreSQL/Redis persistence adapters — Rust, Go, TypeScript, Dart and Gleam slices held to one conformance corpus"
license = "MIT"
keywords = ["lock", "lease", "postgres", "advisory-lock", "fencing", "fiducia", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/ores-locks-and-leases"

[dependencies]
"oresoftware/ores-contracts" = "^0.1.0"
"oresoftware/ores-interfaces" = "^0.1.0"
"oresoftware/typespec-json-schema-validator" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/.ores-lock.toml\" && test -f \"$ZED_PKG_TEST_TARGET/contracts/lock-config/contracts.config.json\" && test -f \"$ZED_PKG_TEST_TARGET/conformance/check.sh\" && test -f \"$ZED_PKG_TEST_TARGET/conformance/cases/lock-plan.json\" && test -f \"$ZED_PKG_TEST_TARGET/conformance/cases/fence-decision.json\" && test -f \"$ZED_PKG_TEST_TARGET/persistence/postgres/fencing.sql\" && test -f \"$ZED_PKG_TEST_TARGET/persistence/redis/fenced-write.lua\""
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/.dart_tool/**",
  "**/build/**",
  "generated/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."

[targets.rust]
dir = "src/rust"
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "ores-locks-and-leases"

[targets.golang]
dir = "src/go"
adapter = "none"

[targets.typescript]
dir = "src/ts"
name = "ores-locks-and-leases-typescript"
adapter = "node"

[targets.typescript.native]
registry = "npm"
package = "@oresoftware/locks-and-leases"
tag_format = "ts/v{version}"

[targets.dart]
dir = "src/dart"
adapter = "dart"

[targets.dart.native]
registry = "pub.dev"
package = "ores_locks_and_leases"
tag_format = "dart/v{version}"

[targets.gleam]
dir = "src/gleam"
adapter = "none"

[targets.contracts]
dir = "contracts"
name = "ores-locks-and-leases-contracts"
adapter = "none"

[targets.conformance]
dir = "conformance"
name = "ores-locks-and-leases-conformance"
adapter = "none"

[targets.persistence]
dir = "persistence"
name = "ores-locks-and-leases-persistence"
adapter = "none"

[scripts]
test = "sh conformance/check.sh"

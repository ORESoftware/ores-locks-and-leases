schema_version = 1
repository = "ORESoftware/ores-locks-and-leases"

[policy]
statuses = ["planned", "modeling", "active", "deferred"]
claim_classes = ["typechecked-specification", "bounded-exhaustive-verification", "implementation-replay", "differential-replay", "symbolic-bitvector-verification", "finite-exhaustive-abstraction"]
counterexamples = "Retain minimized token, identity, crash, layer-order, SQL, Redis, TTL-continuity, and abstract-lifecycle traces and convert each real defect into a deterministic production regression."

[[target]]
id = "independent-lease-fencing-lifecycle"
risk = "critical"
status = "active"
claim_classes = ["finite-exhaustive-abstraction", "implementation-replay"]
source_paths = [
  "src/rust/lease.rs",
  "src/rust/coordinated.rs",
  "persistence/postgres/fencing.sql",
  "persistence/redis/fenced-write.lua",
]
evidence_paths = [
  "formal/model.mjs",
  "formal/fm.toml",
  "formal/PROCEDURE.md",
  ".github/workflows/formal-model.yml",
]
bounds = [
  "two clients, two payload values, logical time zero through five, fencing values through four, and lease TTL two",
  "8126 reachable states and 105638 transitions in the reviewed exact-head run",
]
assumptions = [
  "the JavaScript model is an independent finite abstraction, not the production implementation",
  "language and datastore adapters replay the JSONL action protocol and retain native integration tests",
]

[[target]]
id = "application-fencing-watermark-production-refinement"
risk = "critical"
status = "active"
claim_classes = ["symbolic-bitvector-verification", "bounded-exhaustive-verification", "implementation-replay"]
source_paths = [
  "src/rust/fence.rs",
  "persistence/postgres/fencing.sql",
  "persistence/redis/fenced-write.lua",
]
evidence_paths = [
  "formal/fencing-model/src/lib.rs",
  "conformance/cases/fence-decision.json",
  "persistence/postgres/test-fencing.sql",
  "persistence/redis/test-fenced-write.sh",
]
bounds = [
  "all current and incoming u64 values plus both operation/payload identity bits in Kani",
  "two holders, token generations zero through two, two identities, one crash per holder, and every actor interleaving in the direct-production explicit model",
]
assumptions = [
  "the datastore classifies, advances the watermark, and applies the protected mutation atomically",
  "each physical datastore installs and enforces its own watermark",
]

[[target]]
id = "lock-layer-plan"
risk = "critical"
status = "active"
claim_classes = ["symbolic-bitvector-verification", "implementation-replay"]
source_paths = ["src/rust/plan.rs"]
evidence_paths = ["formal/fencing-model/src/lib.rs", "conformance/cases/lock-plan.json"]
bounds = ["all eight combinations of Fiducia enabled, PostgreSQL enabled, scope, and wait mode"]
assumptions = ["runtime adapters execute the returned plan in order and preserve cleanup errors"]

[[target]]
id = "polyglot-fencing-parity"
risk = "critical"
status = "active"
claim_classes = ["differential-replay", "implementation-replay"]
source_paths = [
  "src/go/fence.go",
  "src/ts/src/fence.ts",
  "src/dart/lib/src/fence.dart",
  "src/gleam/src/ores_locks_and_leases/fence.gleam",
]
evidence_paths = ["conformance/cases/fence-decision.json", "scripts/test-all.sh"]
bounds = ["shared canonical corpus including uint64 maximum, replay, stale, token reuse, and malformed inputs"]
assumptions = ["language runtime integer/string semantics match the exercised corpus outside provider-specific transport layers"]

[[target]]
id = "maintained-transaction-commit-admission"
risk = "critical"
status = "active"
claim_classes = ["finite-exhaustive-abstraction", "implementation-replay"]
source_paths = [
  "src/rust/maintained.rs",
  "src/go/maintained.go",
  "src/ts/src/maintained.ts",
  "src/dart/lib/src/maintained.dart",
  "src/gleam/src/ores_locks_and_leases/maintained.gleam",
]
evidence_paths = [
  "formal/maintained-model.mjs",
  "formal/PROCEDURE.md",
  "docs/maintained-xact-locks.md",
  ".github/workflows/formal-state-machines.yml",
]
bounds = [
  "at most two successful periodic renewals and two PostgreSQL advisory-lock contention retries before each finite terminal branch",
  "878 reachable states, 889 transitions, and 568 terminal outcomes in the reviewed local run",
]
assumptions = [
  "the final renewal completes immediately before the PostgreSQL commit call",
  "the datastore still atomically admits the unchanged fencing token with every protected mutation",
  "transport and database adapters expose the documented failure classifications",
  "every runtime rejects an acquired or renewed effective TTL that differs from the configured acquisition TTL before commit",
  "authority deadline continuity is enforced by the separate renewal supervisor when callers require that stronger metadata guarantee",
]

[[target]]
id = "cleanup-error-precedence"
risk = "critical"
status = "planned"
claim_classes = ["bounded-exhaustive-verification"]
source_paths = ["src/rust/coordinated.rs"]
evidence_paths = []
bounds = ["work failure, renewal loss, Fiducia release failure, PostgreSQL unlock failure, and every pairwise failure combination"]
assumptions = ["network and database adapters expose the documented typed failure classifications"]

schema_version = 1
repository = "ORESoftware/ores-locks-and-leases"

[policy]
statuses = ["planned", "modeling", "active", "deferred"]
claim_classes = ["typechecked-specification", "bounded-exhaustive-verification", "implementation-replay", "differential-replay", "symbolic-bitvector-verification"]
counterexamples = "Retain minimized token, identity, crash, layer-order, SQL, and Redis traces and convert each real defect into a deterministic production regression."

[[target]]
id = "application-fencing-watermark"
risk = "critical"
status = "active"
claim_classes = ["symbolic-bitvector-verification", "bounded-exhaustive-verification", "implementation-replay"]
source_paths = [
  "src/rust/fence.rs",
  "persistence/postgres/fencing.sql",
  "persistence/redis/fenced-write.lua",
]
evidence_paths = [
  "formal/fencing-model/src/lib.rs",
  "conformance/cases/fence-decision.json",
  "persistence/postgres/test-fencing.sql",
  "persistence/redis/test-fenced-write.sh",
]
bounds = [
  "all current and incoming u64 values plus both operation/payload identity bits in Kani",
  "two holders, token generations zero through two, two identities, one crash per holder, and every actor interleaving in the explicit model",
]
assumptions = [
  "the datastore classifies, advances the watermark, and applies the protected mutation atomically",
  "each physical datastore installs and enforces its own watermark",
]

[[target]]
id = "lock-layer-plan"
risk = "critical"
status = "active"
claim_classes = ["symbolic-bitvector-verification", "implementation-replay"]
source_paths = ["src/rust/plan.rs"]
evidence_paths = ["formal/fencing-model/src/lib.rs", "conformance/cases/lock-plan.json"]
bounds = ["all eight combinations of Fiducia enabled, PostgreSQL enabled, scope, and wait mode"]
assumptions = ["runtime adapters execute the returned plan in order and preserve cleanup errors"]

[[target]]
id = "polyglot-fencing-parity"
risk = "critical"
status = "active"
claim_classes = ["differential-replay", "implementation-replay"]
source_paths = [
  "src/go/fence.go",
  "src/ts/src/fence.ts",
  "src/dart/lib/src/fence.dart",
  "src/gleam/src/ores_locks_and_leases/fence.gleam",
]
evidence_paths = ["conformance/cases/fence-decision.json", "scripts/test-all.sh"]
bounds = ["shared canonical corpus including uint64 maximum, replay, stale, token reuse, and malformed inputs"]
assumptions = ["language runtime integer/string semantics match the exercised corpus outside provider-specific transport layers"]

[[target]]
id = "lease-and-cleanup-lifecycle"
risk = "critical"
status = "planned"
claim_classes = ["bounded-exhaustive-verification"]
source_paths = ["src/rust/lease.rs", "src/rust/coordinated.rs"]
evidence_paths = []
bounds = ["two holders, acquire ambiguity, work failure, renewal loss, release failure, PostgreSQL cleanup failure"]
assumptions = ["network and database adapters expose the documented typed failure classifications"]

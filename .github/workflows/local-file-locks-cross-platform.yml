name: local-file-locks-cross-platform

on:
  push:
    branches: [main]
    paths:
      - "conformance/cases/local-file-*.json"
      - "conformance/LOCAL_FILE_LOCKS.md"
      - "docs/local-file-*.md"
      - "docs/scoped-local-file-locks.md"
      - "scripts/check-local-file-*.mjs"
      - "src/rust/local_file*.rs"
      - "src/rust/lib.rs"
      - "src/rust/tests/local_file*.rs"
      - "src/rust/examples/local_file_probe.rs"
      - "src/go/local_file*.go"
      - "src/go/cmd/local_file_probe/**"
      - "src/ts/src/local-file*.ts"
      - "src/ts/src/index.ts"
      - "src/ts/test/local-file*.mjs"
      - "src/ts/package.json"
      - "src/ts/package-lock.json"
      - "src/ts/tsconfig.json"
      - "src/gleam/src/ores_locks_and_leases/local_file*.gleam"
      - "src/gleam/src/ores_locks_and_leases_local_file_ffi.erl"
      - "src/gleam/src/local_file_probe*"
      - "src/gleam/test/local_file*_test.gleam"
      - "src/gleam/gleam.toml"
      - "src/gleam/manifest.toml"
      - ".github/workflows/local-file-locks-cross-platform.yml"
  pull_request:
    paths:
      - "conformance/cases/local-file-*.json"
      - "conformance/LOCAL_FILE_LOCKS.md"
      - "docs/local-file-*.md"
      - "docs/scoped-local-file-locks.md"
      - "scripts/check-local-file-*.mjs"
      - "src/rust/local_file*.rs"
      - "src/rust/lib.rs"
      - "src/rust/tests/local_file*.rs"
      - "src/rust/examples/local_file_probe.rs"
      - "src/go/local_file*.go"
      - "src/go/cmd/local_file_probe/**"
      - "src/ts/src/local-file*.ts"
      - "src/ts/src/index.ts"
      - "src/ts/test/local-file*.mjs"
      - "src/ts/package.json"
      - "src/ts/package-lock.json"
      - "src/ts/tsconfig.json"
      - "src/gleam/src/ores_locks_and_leases/local_file*.gleam"
      - "src/gleam/src/ores_locks_and_leases_local_file_ffi.erl"
      - "src/gleam/src/local_file_probe*"
      - "src/gleam/test/local_file*_test.gleam"
      - "src/gleam/gleam.toml"
      - "src/gleam/manifest.toml"
      - ".github/workflows/local-file-locks-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-file-locks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-local-locks:
    name: ${{ matrix.os }} / Rust + Go + TypeScript + Gleam
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.85.1"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          gleam-version: "1.16.0"
          rebar3-version: "3"

      - name: Validate local lock conformance corpus
        run: node scripts/check-local-file-corpus.mjs

      - name: Rust portable local lock tests
        working-directory: src/rust
        run: |
          cargo test --locked --no-default-features local_file
          cargo test --locked --no-default-features --test local_file_fail_closed
          cargo test --locked --no-default-features --test local_file_scoped
          cargo test --locked --no-default-features --test local_file_recovery
          cargo test --locked --no-default-features --test local_file_path_identity
          cargo test --locked --no-default-features --test local_file_adversarial_v2
          cargo test --locked --no-default-features --test local_file_semantic_v5

      - name: Go portable local lock tests
        working-directory: src/go
        run: go test ./... -run LocalFileLock -count=1

      - name: TypeScript portable local lock tests
        working-directory: src/ts
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node --test test/local-file.test.mjs test/local-file-scoped.test.mjs test/local-file-recovery.test.mjs test/local-file-path-identity.test.mjs test/local-file-adversarial-v2.test.mjs test/local-file-hardening-v3.test.mjs test/local-file-semantic-v4.test.mjs test/local-file-transition-stress.test.mjs test/local-file-fourth-order-v5.test.mjs

      - name: Gleam portable local lock tests
        working-directory: src/gleam
        run: gleam test

      - name: Build local-lock process probes
        shell: bash
        run: |
          mkdir -p tmp
          (cd src/rust && cargo build --locked --no-default-features --example local_file_probe)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd src/go && go build -o ../../tmp/local-file-go-probe.exe ./cmd/local_file_probe)
          else
            (cd src/go && go build -o ../../tmp/local-file-go-probe ./cmd/local_file_probe)
          fi
          (cd src/gleam && gleam build)

      - name: Cross-runtime process interoperability and crash matrix
        run: node scripts/check-local-file-process-interop.mjs

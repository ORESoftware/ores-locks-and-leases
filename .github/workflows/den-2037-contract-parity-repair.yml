name: DEN-2037 contract parity repair

on:
  push:
    branches:
      - den-2037-local-lock-contract-parity-v2
    paths:
      - '.github/workflows/den-2037-contract-parity-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: false
      - name: Install pinned Gleam/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '27'
          gleam-version: '1.16.0'
          rebar3-version: '3'
      - name: Apply Rust contract-bound changes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/rust/local_file.rs';
          let text = fs.readFileSync(path, 'utf8');
          function replaceOnce(from, to, label) {
            const first = text.indexOf(from);
            if (first < 0) throw new Error(`missing replacement anchor: ${label}`);
            if (text.indexOf(from, first + from.length) >= 0) throw new Error(`duplicate replacement anchor: ${label}`);
            text = text.replace(from, to);
          }
          replaceOnce(
            '#[cfg(windows)]\nuse std::os::windows::fs::MetadataExt;',
            '#[cfg(unix)]\nuse std::os::unix::fs::OpenOptionsExt;\n#[cfg(windows)]\nuse std::os::windows::fs::MetadataExt;',
            'unix OpenOptionsExt import',
          );
          replaceOnce(
            'const OWNER_FILE: &str = "owner";\n',
            'const OWNER_FILE: &str = "owner";\nconst OWNER_MAX_CODEPOINTS: usize = 512;\n',
            'owner bound constant',
          );
          replaceOnce(
            `                let owner_file = OpenOptions::new()\n                    .write(true)\n                    .create_new(true)\n                    .open(&owner_path);`,
            `                let mut owner_options = OpenOptions::new();\n                owner_options.write(true).create_new(true);\n                #[cfg(unix)]\n                owner_options.mode(0o600);\n                let owner_file = owner_options.open(&owner_path);`,
            'owner OpenOptions builder',
          );
          replaceOnce(
            `fn validate_owner(path: &Path, owner: &str) -> Result<(), LocalFileLockError> {\n    if owner.is_empty() {\n        return Err(LocalFileLockError::new(\n            LocalFileLockErrorKind::InvalidInput,\n            path,\n            "owner token must not be empty",\n        ));\n    }\n    Ok(())\n}`,
            `fn validate_owner(path: &Path, owner: &str) -> Result<(), LocalFileLockError> {\n    if owner.is_empty() {\n        return Err(LocalFileLockError::new(\n            LocalFileLockErrorKind::InvalidInput,\n            path,\n            "owner token must not be empty",\n        ));\n    }\n    if owner.chars().count() > OWNER_MAX_CODEPOINTS {\n        return Err(LocalFileLockError::new(\n            LocalFileLockErrorKind::InvalidInput,\n            path,\n            "owner token must not exceed 512 Unicode code points",\n        ));\n    }\n    Ok(())\n}`,
            'owner validator',
          );
          const tests = `    #[test]\n    fn owner_at_max_codepoints_is_valid() {\n        let path = test_path("max-owner");\n        let owner = "😀".repeat(512);\n        let mut lock = LocalFileLock::try_acquire(&path, owner)\n            .expect("512-code-point owner must be valid")\n            .expect("holder");\n        lock.release().expect("release max owner lock");\n    }\n\n    #[test]\n    fn oversized_owner_is_invalid_input() {\n        let path = test_path("oversized-owner");\n        let error = LocalFileLock::try_acquire(&path, "😀".repeat(513))\n            .expect_err("513-code-point owner must be rejected");\n        assert_eq!(error.kind, LocalFileLockErrorKind::InvalidInput);\n    }\n\n    #[cfg(unix)]\n    #[test]\n    fn owner_marker_is_private_on_posix() {\n        use std::os::unix::fs::PermissionsExt;\n\n        let path = test_path("private-owner");\n        let mut lock = LocalFileLock::try_acquire(&path, "owner-a")\n            .expect("acquire")\n            .expect("holder");\n        let mode = fs::metadata(path.join(OWNER_FILE))\n            .expect("owner metadata")\n            .permissions()\n            .mode();\n        assert_eq!(mode & 0o077, 0, "owner marker must not expose group/other bits");\n        lock.release().expect("release private owner lock");\n    }\n\n`;
          replaceOnce(
            '    #[test]\n    fn existing_regular_file_is_compromised_not_contention() {',
            tests + '    #[test]\n    fn existing_regular_file_is_compromised_not_contention() {',
            'owner bound tests',
          );
          fs.writeFileSync(path, text);
          NODE
      - name: Apply repository format gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src/rust/Cargo.toml --all
          gofmt -w src/go/local_file.go src/go/local_file_test.go src/go/local_file_recovery.go src/go/local_file_recovery_test.go
          (cd src/gleam && gleam format src test)
          git diff --check
      - name: Commit repair and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-2037-contract-parity-repair.yml
          git add src/rust src/go src/gleam .github/workflows/den-2037-contract-parity-repair.yml
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'DEN-2037 enforce Rust owner bounds and format parity batch'
          git push origin HEAD:den-2037-local-lock-contract-parity-v2

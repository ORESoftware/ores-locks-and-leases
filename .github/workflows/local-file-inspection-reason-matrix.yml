name: local-file-inspection-reason-matrix

on:
  push:
    branches: [main]
    paths:
      - "src/ts/src/local-file*.ts"
      - "src/ts/src/index.ts"
      - "src/ts/test/local-file-inspection-reason-matrix-v6.test.mjs"
      - "src/ts/package.json"
      - "src/ts/package-lock.json"
      - "src/ts/tsconfig.json"
      - ".github/workflows/local-file-inspection-reason-matrix.yml"
  pull_request:
    paths:
      - "src/ts/src/local-file*.ts"
      - "src/ts/src/index.ts"
      - "src/ts/test/local-file-inspection-reason-matrix-v6.test.mjs"
      - "src/ts/package.json"
      - "src/ts/package-lock.json"
      - "src/ts/tsconfig.json"
      - ".github/workflows/local-file-inspection-reason-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-file-inspection-reason-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reason-matrix:
    name: ${{ matrix.os }} / TypeScript inspection reason matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Build TypeScript
        run: npm run build

      - name: Run the 15-task inspection reason/payload matrix
        run: node --test test/local-file-inspection-reason-matrix-v6.test.mjs

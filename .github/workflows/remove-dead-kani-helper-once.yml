name: remove-dead-kani-helper-once

on:
  push:
    branches:
      - DEN-2050/formal-fencing-kani
    paths:
      - .github/workflows/remove-dead-kani-helper-once.yml

permissions:
  contents: write

concurrency:
  group: remove-dead-kani-helper-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-2050/formal-fencing-kani
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Remove the superseded allocation-heavy helper and this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('formal/fencing-model/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          start = text.index('    fn request(token: u64, operation_b: bool, payload_b: bool)')
          end = text.index('    #[kani::proof]\n    fn production_classifier_partitions', start)
          text = text[:start] + text[end:]
          text = text.replace('    use super::key::LockKey;\n', '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path formal/fencing-model/Cargo.toml
          git rm -- .github/workflows/remove-dead-kani-helper-once.yml
          git add -- formal/fencing-model/src/lib.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-2050: remove superseded symbolic request helper'
          git push origin HEAD:DEN-2050/formal-fencing-kani

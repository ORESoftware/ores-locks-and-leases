name: peer-authority-validator

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'formal/**'
      - '.github/workflows/peer-authority-validator.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'formal/**'
      - '.github/workflows/peer-authority-validator.yml'
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: peer-authority-validator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  repair-rustfmt:
    if: github.event_name == 'pull_request' && github.head_ref == 'reconcile/den-3828-shared-interfaces-current-main-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out writable feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Format Rust and remove this one-shot repair job
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src/rust/Cargo.toml --all
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/peer-authority-validator.yml
          git diff --check
          git config user.name 'ORESoftware automation'
          git config user.email 'alex@oresoftware.com'
          git add src/rust .github/workflows/peer-authority-validator.yml
          git commit -m 'style: apply pinned rustfmt to current lock runtime'
          git push origin HEAD:${{ github.head_ref }}

  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify checked-out revision and negative verifier syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check contracts/mapping-tests/check-stale-mapping-receipt.mjs

      - name: Compare independently authored TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@b2c4810400625829114a56087ad33937caac735a
        with:
          typespec: contracts/typespec/main.tsp
          schema: contracts/json-schema/contract.schema.json
          int64_strategy: number
          report: target/typespec-json-schema-validator/positive/report.json
          sarif: target/typespec-json-schema-validator/positive/report.sarif
          contract_ir: target/typespec-json-schema-validator/positive/contract-ir.json
          output_dir: target/typespec-json-schema-validator/positive/generated-schema-b
          max_probes: '128'
          quiet: 'true'

      - name: Prove a stale contract mapping stops evaluation
        id: stale_mapping
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@b2c4810400625829114a56087ad33937caac735a
        with:
          typespec: contracts/typespec/main.tsp
          schema: contracts/json-schema/contract.schema.json
          mapping: contracts/mapping-tests/stale.mapping.json
          int64_strategy: number
          report: target/typespec-json-schema-validator/stale-mapping/report.json
          sarif: target/typespec-json-schema-validator/stale-mapping/report.sarif
          contract_ir: target/typespec-json-schema-validator/stale-mapping/contract-ir.json
          output_dir: target/typespec-json-schema-validator/stale-mapping/generated-schema-b
          max_probes: '128'
          quiet: 'true'

      - name: Verify attributable mapping evidence and immutable authorities
        shell: bash
        env:
          STALE_MAPPING_OUTCOME: ${{ steps.stale_mapping.outcome }}
        run: |
          set -euo pipefail
          test "$STALE_MAPPING_OUTCOME" = failure
          node contracts/mapping-tests/check-stale-mapping-receipt.mjs \
            target/typespec-json-schema-validator/stale-mapping/report.json
          test -s target/typespec-json-schema-validator/positive/contract-ir.json
          test -s target/typespec-json-schema-validator/stale-mapping/contract-ir.json
          git diff --exit-code -- \
            contracts/typespec/main.tsp \
            contracts/json-schema/contract.schema.json \
            contracts/mapping-tests/stale.mapping.json

      - name: Upload deterministic positive and negative parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-authority-evidence-${{ env.EXPECTED_SHA }}
          path: target/typespec-json-schema-validator/
          if-no-files-found: error
          retention-days: 30

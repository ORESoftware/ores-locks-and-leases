name: peer-authority-validator

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'formal/**'
      - '.github/workflows/peer-authority-validator.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'formal/**'
      - '.github/workflows/peer-authority-validator.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: peer-authority-validator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify checked-out revision and negative verifier syntax
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check contracts/mapping-tests/check-stale-mapping-receipt.mjs

      - name: Compare independently authored TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@2281843126ab644607b11cf8281d84f382d68dfc
        with:
          typespec: contracts/typespec/main.tsp
          schema: contracts/json-schema/contract.schema.json
          int64_strategy: number
          report: target/typespec-json-schema-validator/positive/report.json
          sarif: target/typespec-json-schema-validator/positive/report.sarif
          output_dir: target/typespec-json-schema-validator/positive/generated-schema-b
          max_probes: '128'

      - name: Prove a stale contract mapping stops evaluation
        id: stale_mapping
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@2281843126ab644607b11cf8281d84f382d68dfc
        with:
          typespec: contracts/typespec/main.tsp
          schema: contracts/json-schema/contract.schema.json
          mapping: contracts/mapping-tests/stale.mapping.json
          int64_strategy: number
          report: target/typespec-json-schema-validator/stale-mapping/report.json
          sarif: target/typespec-json-schema-validator/stale-mapping/report.sarif
          output_dir: target/typespec-json-schema-validator/stale-mapping/generated-schema-b
          max_probes: '128'

      - name: Verify attributable mapping evidence and immutable authorities
        shell: bash
        env:
          STALE_MAPPING_OUTCOME: ${{ steps.stale_mapping.outcome }}
        run: |
          set -euo pipefail
          test "$STALE_MAPPING_OUTCOME" = failure
          node contracts/mapping-tests/check-stale-mapping-receipt.mjs \
            target/typespec-json-schema-validator/stale-mapping/report.json
          git diff --exit-code -- \
            contracts/typespec/main.tsp \
            contracts/json-schema/contract.schema.json \
            contracts/mapping-tests/stale.mapping.json

      - name: Upload deterministic positive and negative parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-authority-evidence-${{ github.sha }}
          path: target/typespec-json-schema-validator/
          if-no-files-found: error
          retention-days: 30

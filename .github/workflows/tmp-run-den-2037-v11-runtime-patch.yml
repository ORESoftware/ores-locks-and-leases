name: tmp run DEN-2037 v11 runtime patch
# retrigger after deterministic publication-fault test migration

on:
  push:
    branches: [den-2037-eleventh-order-15-20260915]
    paths: [.github/workflows/tmp-run-den-2037-v11-runtime-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-2037-eleventh-order-15-20260915
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply existing guarded patch with typed permission-fault classification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ORESoftware
          git config user.email noreply@github.com
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('.github/workflows/tmp-den-2037-v11-runtime-patch.yml', 'utf8');
          const beginMarker = "          node <<'NODE'\n";
          const endMarker = "\n          NODE\n";
          const begin = source.indexOf(beginMarker);
          if (begin < 0) throw new Error('missing embedded runtime patch start');
          const end = source.indexOf(endMarker, begin + beginMarker.length);
          if (end < 0) throw new Error('missing embedded runtime patch end');
          const patch = source.slice(begin + beginMarker.length, end)
            .split('\n')
            .map((line) => line.startsWith('          ') ? line.slice(10) : line)
            .join('\n');
          fs.writeFileSync('/tmp/den2037-v11-patch.cjs', patch);
          NODE
          node /tmp/den2037-v11-patch.cjs
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'src/ts/src/local-file.ts';
          let s = fs.readFileSync(p, 'utf8');
          const before = 'export async function read_bounded_local_file_lock_owner(lockPath: string, ownerPath: string): Promise<string> {\n  maybe_inject_local_file_test_fault("owner_read_permission", "EACCES");\n  let handle;';
          const after = 'export async function read_bounded_local_file_lock_owner(lockPath: string, ownerPath: string): Promise<string> {\n  let handle;';
          if (!s.includes(before)) throw new Error('missing pre-open permission injection');
          s = s.replace(before, after);
          const tryBefore = '  let handle;\n  try {\n    const pathMetadata = await lstat(ownerPath);';
          const tryAfter = '  let handle;\n  try {\n    maybe_inject_local_file_test_fault("owner_read_permission", "EACCES");\n    const pathMetadata = await lstat(ownerPath);';
          if (!s.includes(tryBefore)) throw new Error('missing owner-read IO try/catch');
          s = s.replace(tryBefore, tryAfter);
          fs.writeFileSync(p, s);
          NODE
          npm ci --prefix src/ts --no-audit --no-fund
          npm run build --prefix src/ts
          npm test --prefix src/ts
          node scripts/check-local-file-fault-injection-eleventh-order.mjs
          git add src/ts/src/local-file.ts src/ts/src/local-file-recovery.ts
          git diff --cached --check
          git commit -m 'DEN-2037 add deterministic publication faults and ABA-safe handles'
          git push origin HEAD:den-2037-eleventh-order-15-20260915

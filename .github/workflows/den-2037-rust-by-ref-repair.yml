name: DEN-2037 Rust bounded owner read repair

on:
  push:
    branches: [den-2037-local-lock-adversarial-v3]
    paths: ['.github/workflows/den-2037-rust-by-ref-repair.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-local-lock-adversarial-v3
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with: { toolchain: '1.85.1', components: 'rustfmt' }
      - name: Disambiguate bounded owner read and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/rust/local_file.rs')
          text = p.read_text()
          old = '''    owner_file
        .by_ref()
        .take((OWNER_MAX_UTF8_BYTES + 1) as u64)
'''
          new = '''    std::io::Read::by_ref(&mut owner_file)
        .take((OWNER_MAX_UTF8_BYTES + 1) as u64)
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one bounded owner read anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path src/rust/Cargo.toml --all -- --check
          cargo test --manifest-path src/rust/Cargo.toml --locked --no-default-features local_file
          git diff --check
      - name: Commit repair and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-2037-rust-by-ref-repair.yml
          git add src/rust/local_file.rs
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'fix(DEN-2037): disambiguate bounded Rust owner read'
          git push origin HEAD:den-2037-local-lock-adversarial-v3

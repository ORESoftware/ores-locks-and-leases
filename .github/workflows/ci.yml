name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: locks
          POSTGRES_DB: locks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, show-progress: false }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with: { toolchain: "1.85.1", components: "rustfmt,clippy" }
      - name: Format
        working-directory: src/rust
        run: cargo fmt --all -- --check
      - name: Core compiles with no features and no dependencies
        working-directory: src/rust
        run: cargo check --locked --no-default-features
      - name: Clippy (all features)
        working-directory: src/rust
        run: cargo clippy --locked --all-targets --features full -- -D warnings
      - name: Test (all features, live Postgres)
        working-directory: src/rust
        env:
          ORES_LOCKS_TEST_DATABASE_URL: postgres://postgres:locks@localhost:5432/locks
        run: cargo test --locked --all-targets --features full

  rustsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, show-progress: false }
      - name: Audit the locked Rust dependency graph
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src/rust

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, show-progress: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.22", cache: false }
      - working-directory: src/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, show-progress: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - working-directory: src/ts
        run: |
          npm ci --no-audit --no-fund
          npm test

  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, show-progress: false }
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - working-directory: src/dart
        run: |
          dart pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test

  gleam:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, show-progress: false }
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with: { otp-version: "27", gleam-version: "1.16.0", rebar3-version: "3" }
      - working-directory: src/gleam
        run: |
          gleam format --check src test
          gleam test

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, show-progress: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - name: TypeSpec and JSON Schema authorities agree
        run: npx --yes --package=https://github.com/ORESoftware/ores-contracts/archive/f79ea8d8d94d7a9e78c15f7e46ecae8e4b584d2e.tar.gz ores-contracts check --config contracts/contracts.config.json

  generated-lib-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, show-progress: false }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with: { toolchain: "1.85.1" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.22", cache: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with: { otp-version: "27", gleam-version: "1.16.0", rebar3-version: "3" }
      - name: Install pinned Zed CLI
        env:
          ZED_SHA256: f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a
          ZED_URL: https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz
        run: |
          mkdir -p "$RUNNER_TEMP/zed-v0.3.0"
          curl --fail --location --silent --show-error "$ZED_URL" --output "$RUNNER_TEMP/zed-v0.3.0.tar.gz"
          echo "$ZED_SHA256  $RUNNER_TEMP/zed-v0.3.0.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed-v0.3.0.tar.gz" -C "$RUNNER_TEMP/zed-v0.3.0"
          echo "$RUNNER_TEMP/zed-v0.3.0" >> "$GITHUB_PATH"
      - name: Generate and test the lib-core package in every runtime
        run: scripts/test-generated-lib-core.sh

name: tmp DEN-2037 Gleam interop fix

on:
  push:
    branches:
      - reconcile/den-2037-tenth-order-current-main-20260915
    paths:
      - .github/workflows/tmp-den-2037-gleam-interop-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: reconcile/den-2037-tenth-order-current-main-20260915
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply patch and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ORESoftware
          git config user.email noreply@github.com
          node scripts/tmp-patch-gleam-interop.mjs
          rm scripts/tmp-patch-gleam-interop.mjs
          rm .github/workflows/tmp-den-2037-gleam-interop-fix.yml
          git add -A
          git diff --cached --check
          git commit -m 'DEN-2037 run built Gleam probe directly in process races'
          git push origin HEAD:reconcile/den-2037-tenth-order-current-main-20260915

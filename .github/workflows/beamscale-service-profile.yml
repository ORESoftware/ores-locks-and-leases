name: beamscale-service-profile

on:
  pull_request:
    paths:
      - ".ores-lock.toml"
      - "contracts/lock-config/**"
      - "conformance/cases/service-beamscale-pg.json"
      - "docs/managed-authorities.md"
      - "scripts/check-service-beamscale-profile.mjs"
      - "src/rust/**"
      - "src/ts/**"
      - ".github/workflows/beamscale-service-profile.yml"
  push:
    branches: [main]
    paths:
      - ".ores-lock.toml"
      - "contracts/lock-config/**"
      - "conformance/cases/service-beamscale-pg.json"
      - "docs/managed-authorities.md"
      - "scripts/check-service-beamscale-profile.mjs"
      - "src/rust/**"
      - "src/ts/**"
      - ".github/workflows/beamscale-service-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.85.1"
          components: "rustfmt,clippy"
      - run: node scripts/check-service-beamscale-profile.mjs
      - run: sh scripts/check-tjsv-contracts.sh config
      - name: Rust config projection
        working-directory: src/rust
        run: |
          cargo fmt --all -- --check
          cargo test --locked --features config config

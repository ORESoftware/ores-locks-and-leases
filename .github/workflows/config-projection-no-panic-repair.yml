name: config projection no-panic repair

on:
  push:
    branches: [hardening/config-projection-no-panic]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/config-projection-no-panic
          fetch-depth: 0

      - name: Make projection fail closed without panic
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/rust/config.rs';
          let src = fs.readFileSync(path, 'utf8');
          const oldMethod = `    #[must_use]\n    pub fn lease_acquire_options(&self) -> Option<(AcquireOptions, bool)> {\n        self.providers.fiducia.then(|| {\n            (\n                AcquireOptions {\n                    ttl: Duration::from_millis(\n                        self.ttl_ms\n                            .expect("validated Fiducia profiles require ttl_ms"),\n                    ),\n                    wait_timeout: Duration::from_millis(self.wait_timeout_ms),\n                    retry_interval: Duration::from_millis(self.retry_interval_ms),\n                    holder: None,\n                },\n                self.wait,\n            )\n        })\n    }`;
          const newMethod = `    pub fn lease_acquire_options(\n        &self,\n    ) -> Result<Option<(AcquireOptions, bool)>, LockConfigError> {\n        if !self.providers.fiducia {\n            return Ok(None);\n        }\n        let ttl_ms = self.ttl_ms.ok_or_else(|| {\n            LockConfigError::new(\n                "ttl_missing",\n                "profiles.ttl_ms",\n                "enabled Fiducia provider requires ttl_ms",\n            )\n        })?;\n        Ok(Some((\n            AcquireOptions {\n                ttl: Duration::from_millis(ttl_ms),\n                wait_timeout: Duration::from_millis(self.wait_timeout_ms),\n                retry_interval: Duration::from_millis(self.retry_interval_ms),\n                holder: None,\n            },\n            self.wait,\n        )))\n    }`;
          if (!src.includes(oldMethod)) throw new Error('lease_acquire_options anchor missing');
          src = src.replace(oldMethod, newMethod);
          src = src.replace(
            'assert!(local.lease_acquire_options().is_none());',
            'assert!(local.lease_acquire_options().expect("local projection").is_none());'
          );
          src = src.replace(
            'let (options, wait) = service.lease_acquire_options().expect("lease options");',
            'let (options, wait) = service\n            .lease_acquire_options()\n            .expect("service projection")\n            .expect("lease options");'
          );
          fs.writeFileSync(path, src);
          NODE

          cat > src/rust/tests/config_projection_no_panic.rs <<'RS'
          use ores_locks_and_leases::config::{
              FiduciaProviderConfig, LockProfileConfig, ProviderSelection,
          };

          #[test]
          fn mutated_fiducia_profile_without_ttl_fails_closed_without_panicking() {
              let profile = LockProfileConfig {
                  profile_id: "mutated-service".to_owned(),
                  wait: true,
                  wait_timeout_ms: 30_000,
                  retry_interval_ms: 50,
                  ttl_ms: None,
                  renew_interval_ms: None,
                  providers: ProviderSelection {
                      local_file: false,
                      fiducia: true,
                      pg_advisory: false,
                  },
                  local_file: None,
                  fiducia: Some(FiduciaProviderConfig {
                      endpoint_env: "FIDUCIA_BASE_URL".to_owned(),
                      auth_token_env: "FIDUCIA_AUTH_TOKEN".to_owned(),
                  }),
                  postgres: None,
              };

              let caught = std::panic::catch_unwind(|| profile.lease_acquire_options());
              assert!(caught.is_ok(), "projection must never panic on public-field mutation");
              let error = caught
                  .expect("no panic")
                  .expect_err("missing Fiducia TTL must fail closed");
              assert_eq!(error.code, "ttl_missing");
              assert_eq!(error.path, "profiles.ttl_ms");
          }
          RS

      - name: Validate focused Rust config hardening
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src/rust/Cargo.toml --all
          cargo test --locked --manifest-path src/rust/Cargo.toml --features config --test config_projection_no_panic
          cargo test --locked --manifest-path src/rust/Cargo.toml --features config --lib
          git diff --check

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/config-projection-no-panic-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rust/config.rs src/rust/tests/config_projection_no_panic.rs .github/workflows/config-projection-no-panic-repair.yml
          git commit -m 'fix(config): make lease projection fail closed without panic'
          git push origin HEAD:hardening/config-projection-no-panic

name: semantic-sync-57-71

on:
  push:
    branches: [tmp/semantic-sync-run-57-71-20260915]

permissions:
  contents: write

jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Compose reviewed parent into reviewed child
        shell: bash
        run: |
          set -euo pipefail
          child=459cb2bbb0c96d53e0aa58dba7437cf1d4373b11
          parent=dc6869f647b256c4e0bc5f08f0f38ae990b864a7
          git config user.name 'ORESoftware semantic sync'
          git config user.email 'alex@oresoftware.com'
          git checkout --detach "$child"
          git merge --no-ff -X ours -m 'merge(DEN-2037): compose parent local-lock hardening with interop stack' "$parent"
          test -z "$(git diff --name-only --diff-filter=U)"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: 'rustfmt,clippy'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.22', cache: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with: { otp-version: '27', gleam-version: '1.16.0', rebar3-version: '3' }

      - name: Reconcile overlapping Rust helpers
        shell: bash
        run: |
          set -euo pipefail
          file=src/rust/local_file.rs
          recovery=src/rust/local_file_recovery.rs

          test "$(grep -c '^fn create_lock_directory' "$file")" -eq 2
          perl -0pi -e 's/fn create_lock_directory\(path: &Path\) -> io::Result<\(\)> \{\n    #\[cfg\(unix\)\]\n    \{\n        let mut builder = fs::DirBuilder::new\(\);\n        builder\.mode\(0o700\);\n        builder\.create\(path\)\n    \}\n    #\[cfg\(not\(unix\)\)\]\n    \{\n        fs::create_dir\(path\)\n    \}\n\}\n\n//' "$file"
          test "$(grep -c '^fn create_lock_directory' "$file")" -eq 1

          perl -0pi -e 's/use std::fs::\{self, OpenOptions\};/use std::fs::{self, File, OpenOptions};/' "$file"
          perl -0pi -e 's/use std::io::\{self, Write\};/use std::io::{self, Read, Write};/' "$file"
          perl -0pi -e 's/use std::os::unix::fs::\{DirBuilderExt, MetadataExt, OpenOptionsExt\};/use std::os::unix::fs::{DirBuilderExt, MetadataExt, OpenOptionsExt, PermissionsExt};/' "$file"
          grep -q 'use std::fs::{self, File, OpenOptions};' "$file"
          grep -q 'use std::io::{self, Read, Write};' "$file"
          grep -q 'PermissionsExt' "$file"

          if ! grep -q '^use std::ffi::OsString;' "$recovery"; then
            perl -0pi -e 's/(use crate::local_file::\{.*?\n\};\n)/$1use std::ffi::OsString;\n/s' "$recovery"
          fi
          grep -q '^use std::ffi::OsString;' "$recovery"

      - name: Reconcile overlapping TypeScript inspection helper
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/ts/src/local-file-recovery.ts';
          let source = fs.readFileSync(path, 'utf8');
          const marker = 'async function read_inspection_owner(';
          const first = source.indexOf(marker);
          const second = source.indexOf(marker, first + marker.length);
          if (first < 0 || second < 0) throw new Error('expected exactly two composed read_inspection_owner helpers');
          if (source.indexOf(marker, second + marker.length) >= 0) throw new Error('unexpected third read_inspection_owner helper');
          const next = source.indexOf('\nfunction incomplete(', second);
          if (next < 0) throw new Error('could not bound duplicate inspection helper');
          source = source.slice(0, second) + source.slice(next + 1);
          fs.writeFileSync(path, source);
          NODE
          test "$(grep -c '^async function read_inspection_owner' src/ts/src/local-file-recovery.ts)" -eq 1

      - name: Normalize merge-only formatting
        shell: bash
        run: |
          set -euo pipefail
          (cd src/rust && cargo fmt --all)
          (cd src/go && gofmt -w .)
          git add src/rust src/go src/ts
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          test "$(git rev-parse HEAD^1)" = '459cb2bbb0c96d53e0aa58dba7437cf1d4373b11'
          test "$(git rev-parse HEAD^2)" = 'dc6869f647b256c4e0bc5f08f0f38ae990b864a7'

      - name: Verify merged contract corpus
        run: node scripts/check-local-file-corpus.mjs

      - name: Verify merged Rust local-lock surface
        working-directory: src/rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --no-default-features local_file
          cargo test --locked --no-default-features --test local_file_fail_closed
          cargo test --locked --no-default-features --test local_file_scoped
          cargo test --locked --no-default-features --test local_file_recovery
          cargo test --locked --no-default-features --test local_file_path_identity
          cargo test --locked --no-default-features --test local_file_adversarial_v2
          cargo test --locked --no-default-features --test local_file_semantic_v5
          cargo test --locked --no-default-features --test local_file_retry_budget_v6
          cargo test --locked --no-default-features --test local_file_parent_lifecycle_v6
          cargo test --locked --no-default-features --test local_file_hardlink_v6
          cargo test --locked --no-default-features --test local_file_path_admission_v7

      - name: Verify merged Go local-lock surface
        working-directory: src/go
        run: |
          git diff --exit-code -- .
          go test ./... -count=1

      - name: Verify merged TypeScript local-lock surface
        working-directory: src/ts
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Verify merged Gleam local-lock surface
        working-directory: src/gleam
        run: |
          gleam format src test
          git diff --exit-code -- src test
          gleam test

      - name: Build merged process probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          (cd src/rust && cargo build --locked --no-default-features --example local_file_probe)
          (cd src/go && go build -o ../../tmp/local-file-go-probe ./cmd/local_file_probe)
          (cd src/gleam && gleam build)

      - name: Verify merged fifth through eighth order process behavior
        run: |
          node scripts/check-local-file-process-interop.mjs
          node scripts/check-local-file-process-sixth-order.mjs
          node scripts/check-local-file-process-eighth-order.mjs

      - name: Publish verified two-parent merge candidate
        shell: bash
        run: |
          set -euo pipefail
          merge_sha=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^1)" = '459cb2bbb0c96d53e0aa58dba7437cf1d4373b11'
          test "$(git rev-parse HEAD^2)" = 'dc6869f647b256c4e0bc5f08f0f38ae990b864a7'
          git push --force-with-lease origin "HEAD:refs/heads/tmp/semantic-sync-result-57-71-20260915"
          echo "merge_sha=$merge_sha" >> "$GITHUB_STEP_SUMMARY"

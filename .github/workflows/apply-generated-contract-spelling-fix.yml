name: Apply generated-contract spelling fix

on:
  push:
    branches:
      - feat/DEN-2050-maintained-xact-admission
    paths:
      - '.github/workflows/apply-generated-contract-spelling-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/DEN-2050-maintained-xact-admission
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Remove redundant Draft 2020-12 keyword and add regression probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('templates/lib-core/gen_org_locks.py')
          text = generator.read_text(encoding='utf-8')
          old = '                    "additionalProperties": False,\n                    "unevaluatedProperties": False,'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected exactly three redundant object-sealing pairs, found {count}')
          text = text.replace(old, '                    "unevaluatedProperties": False,')
          generator.write_text(text, encoding='utf-8')

          safety = Path('scripts/test-generator-safety.sh')
          text = safety.read_text(encoding='utf-8')
          marker = '''git -C "$fixture" show "$generated_commit:locks/rust/Cargo.toml" \\
  | grep -q '^resolver = "3"$'\n'''
          addition = marker + '''# The authored Draft 2020-12 peer must use the same sealing spelling as\n# TypeSpec Schema B. `additionalProperties: false` is behaviorally redundant\n# beside `unevaluatedProperties: false`, but TJSV intentionally rejects the\n# structural mismatch instead of choosing one authority as the winner.\ngit -C "$fixture" show "$generated_commit:locks/contracts/json-schema/contract.schema.json" \\
  | python3 "$repo_root/scripts/check-generated-contract-sealing.py" -\n'''
          if text.count(marker) != 1:
              raise SystemExit('generator-safety insertion marker drifted')
          text = text.replace(marker, addition)
          safety.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-generated-contract-spelling-fix.yml').unlink()
          PY

          git diff --check
          python3 -m py_compile templates/lib-core/gen_org_locks.py scripts/check-generated-contract-sealing.py
          sh -n scripts/test-generator-safety.sh
          bash scripts/test-generator-safety.sh

      - name: Commit the reviewed deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware GitHub Actions'
          git config user.email 'noreply@github.com'
          git add -- \
            templates/lib-core/gen_org_locks.py \
            scripts/test-generator-safety.sh \
            scripts/check-generated-contract-sealing.py \
            .github/workflows/apply-generated-contract-spelling-fix.yml
          git commit -m 'fix(DEN-2050): align generated Schema A sealing with TypeSpec'
          git push origin HEAD:feat/DEN-2050-maintained-xact-admission

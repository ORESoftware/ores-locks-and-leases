name: tmp-rustls-lock-refresh
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-rustls-lock-refresh.yml'
      - 'src/rust/Cargo.toml'
      - 'src/rust/Cargo.lock'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Generate patched lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path src/rust/Cargo.toml -p rustls --precise 0.23.45
          cargo metadata --manifest-path src/rust/Cargo.toml --locked --no-deps >/dev/null
          printf 'LOCKFILE_BASE64='
          base64 -w0 src/rust/Cargo.lock
          printf '\n'

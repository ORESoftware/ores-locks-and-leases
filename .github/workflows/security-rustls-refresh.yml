name: security-rustls-refresh

on:
  push:
    branches:
      - DEN-3828-polyglot-tjsv-ores-interfaces
    paths:
      - '.github/workflows/security-rustls-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'ORESoftware/ores-locks-and-leases' && github.ref_name == 'DEN-3828-polyglot-tjsv-ores-interfaces'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-3828-polyglot-tjsv-ores-interfaces
          fetch-depth: 1

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'

      - name: Refresh only rustls to the patched release
        working-directory: src/rust
        run: |
          cargo update -p rustls --precise 0.23.45
          grep -A3 '^name = "rustls"' Cargo.lock | grep 'version = "0.23.45"'
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Commit generated lockfile
        run: |
          git config user.name 'ORESoftware CI'
          git config user.email 'ci@oresoftware.com'
          git add src/rust/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock is already patched.'
            exit 0
          fi
          git commit -m 'security: update rustls to 0.23.45'
          git push origin HEAD:DEN-3828-polyglot-tjsv-ores-interfaces

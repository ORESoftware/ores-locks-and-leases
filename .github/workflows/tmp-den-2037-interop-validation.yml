name: tmp DEN-2037 interop validation

on:
  push:
    branches:
      - reconcile/den-2037-tenth-order-current-main-20260915
    paths:
      - .github/workflows/tmp-den-2037-interop-validation.yml

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: reconcile/den-2037-tenth-order-current-main-20260915
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.85.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.22'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27'
          gleam-version: '1.16.0'
          rebar3-version: '3'
      - name: Build all local-lock probes
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix src/ts --no-audit --no-fund
          npm run build --prefix src/ts
          mkdir -p tmp
          (cd src/rust && cargo build --locked --no-default-features --example local_file_probe)
          (cd src/go && go build -o ../../tmp/local-file-go-probe ./cmd/local_file_probe)
          (cd src/gleam && gleam build)
      - name: Cross-runtime interop
        run: node scripts/run-with-gleam-startup-serialization.mjs scripts/check-local-file-process-interop.mjs
      - name: Sixth-order process recovery
        run: node scripts/run-with-gleam-startup-serialization.mjs scripts/check-local-file-process-sixth-order.mjs
      - name: Eighth-order identity isolation recovery
        run: node scripts/run-with-gleam-startup-serialization.mjs scripts/check-local-file-process-eighth-order.mjs
      - name: Ninth-order alias transition isolation
        run: node scripts/run-with-gleam-startup-serialization.mjs scripts/check-local-file-process-ninth-order.mjs

name: config rollout batch repair

on:
  push:
    branches: [config/ores-lock-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: config-rollout-batch-repair
  cancel-in-progress: true

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: config/ores-lock-v1
          fetch-depth: 0

      - name: Extend lib-core generator and generator tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const generatorPath = 'templates/lib-core/gen_org_locks.py';
          let generator = fs.readFileSync(generatorPath, 'utf8');
          const manifestAnchor = '    entry_rows = "\\n".join(\n';
          if (!generator.includes(manifestAnchor)) throw new Error('generator manifest anchor missing');
          if (!generator.includes('files["locks/.ores-lock.toml"]')) {
            const configBlock = `    files["locks/.ores-lock.toml"] = '''# Runtime coordination policy generated by ORESoftware/ores-locks-and-leases.\n# Package/build/install/publish/test mechanics stay in .zpkg.toml.\n# Secrets are referenced by environment-variable name only.\nschema_version = "ores.lock.config.v1"\ndefault_profile = "local-install"\nselected_profile_env = "ORES_LOCK_PROFILE"\n\n[[env]]\nkey = "ORES_LOCK_PROFILE"\nkind = "string"\nrequired = false\nsecret = false\npurpose = "Select one declared lock profile at process startup."\n\n[[env]]\nkey = "ORES_LOCK_ROOT"\nkind = "path"\nrequired = false\nsecret = false\npurpose = "Local-file lock rendezvous root."\n\n[[env]]\nkey = "FIDUCIA_BASE_URL"\nkind = "url"\nrequired = false\nsecret = false\npurpose = "Fiducia lease authority endpoint."\n\n[[env]]\nkey = "FIDUCIA_AUTH_TOKEN"\nkind = "string"\nrequired = false\nsecret = true\npurpose = "Credential for the Fiducia lease authority."\n\n[[env]]\nkey = "DATABASE_URL"\nkind = "string"\nrequired = false\nsecret = true\npurpose = "PostgreSQL connection string used by the advisory-lock provider."\n\n[[profiles]]\nprofile_id = "local-install"\nwait = true\nwait_timeout_ms = 30000\nretry_interval_ms = 50\n\n[profiles.providers]\nlocal_file = true\nfiducia = false\npg_advisory = false\n\n[profiles.local_file]\nroot_env = "ORES_LOCK_ROOT"\nrequire_existing_root = false\n\n[[profiles]]\nprofile_id = "service-composed"\nwait = true\nwait_timeout_ms = 30000\nretry_interval_ms = 50\nttl_ms = 30000\nrenew_interval_ms = 10000\n\n[profiles.providers]\nlocal_file = false\nfiducia = true\npg_advisory = true\n\n[profiles.fiducia]\nendpoint_env = "FIDUCIA_BASE_URL"\nauth_token_env = "FIDUCIA_AUTH_TOKEN"\n\n[profiles.postgres]\ndatabase_url_env = "DATABASE_URL"\nscope = "transaction"\n'''\n\n`;
            generator = generator.replace(manifestAnchor, configBlock + manifestAnchor);
          }

          const readmeAnchor = '## Resolving the shared package\n\n';
          if (!generator.includes(readmeAnchor)) throw new Error('README anchor missing');
          if (!generator.includes('## Runtime lock policy')) {
            const docs = '## Runtime lock policy\n\n`locks/.ores-lock.toml` is the runtime coordination policy. It is generated alongside this package so every consumer starts from the same admitted provider/timing shape. `.zpkg.toml` remains package/build/install/publish/test metadata only. Select `local-install` for single-machine local-file coordination or `service-composed` for Fiducia + PostgreSQL advisory locking; `ORES_LOCK_PROFILE` may select a declared profile at process startup. Secret values never live in this file: only environment-variable names and metadata are stored.\n\n';
            generator = generator.replace(readmeAnchor, docs + readmeAnchor);
          }

          const messageAnchor = '        f"TypeSpec + JSON Schema contract (ores-contracts), and the root .zpkg.toml\\n"\n';
          if (!generator.includes(messageAnchor)) throw new Error('commit message anchor missing');
          generator = generator.replace(
            messageAnchor,
            '        f"TypeSpec + JSON Schema contract (ores-contracts), generated .ores-lock.toml runtime policy,\\n"\n        f"and the root .zpkg.toml\\n"\n'
          );
          fs.writeFileSync(generatorPath, generator);

          const testPath = 'scripts/test-generator-layout.py';
          let tests = fs.readFileSync(testPath, 'utf8');
          const catalogAnchor = '        catalog_path = self.repo / "locks/catalog.json"\n';
          if (!tests.includes(catalogAnchor)) throw new Error('test catalog anchor missing');
          if (!tests.includes('generated_lock_config =')) {
            tests = tests.replace(
              catalogAnchor,
              catalogAnchor +
              '        generated_lock_config = (self.repo / "locks/.ores-lock.toml").read_text()\n' +
              '        self.assertIn(\'schema_version = "ores.lock.config.v1"\', generated_lock_config)\n' +
              '        self.assertIn(\'default_profile = "local-install"\', generated_lock_config)\n' +
              '        self.assertIn(\'profile_id = "service-composed"\', generated_lock_config)\n' +
              '        self.assertIn(\'secret = true\', generated_lock_config)\n' +
              '        self.assertNotIn("postgres://", generated_lock_config)\n' +
              '        self.assertNotIn("Bearer ", generated_lock_config)\n' +
              '        self.assertEqual(generated_lock_config.count("[[profiles]]"), 2)\n'
            );
          }
          const manifestLoop = '        for runtime in RUNTIMES:\n            self.assertIn(\'dir = "langs/\' + runtime + \'"\', manifest)\n';
          if (!tests.includes(manifestLoop)) throw new Error('manifest loop anchor missing');
          if (!tests.includes('wait_timeout_ms", manifest')) {
            tests = tests.replace(
              manifestLoop,
              manifestLoop +
              '        for operational_key in ("wait_timeout_ms", "retry_interval_ms", "ttl_ms", "renew_interval_ms"):\n' +
              '            self.assertNotIn(operational_key, manifest)\n' +
              '        self.assertEqual((self.repo / "locks/.ores-lock.toml").read_text(), generated_lock_config)\n' +
              '        readme = (self.repo / "locks/README.md").read_text()\n' +
              '        self.assertIn(".ores-lock.toml", readme)\n' +
              '        self.assertIn("service-composed", readme)\n'
            );
          }
          const previewAnchor = '        self.assertIn("locks/langs/rust/lib.rs\\n", result.stdout)\n';
          if (!tests.includes(previewAnchor)) throw new Error('preview anchor missing');
          if (!tests.includes('locks/.ores-lock.toml\\n')) {
            tests = tests.replace(
              previewAnchor,
              previewAnchor + '        self.assertIn("locks/.ores-lock.toml\\n", result.stdout)\n'
            );
          }
          fs.writeFileSync(testPath, tests);
          NODE

      - name: Validate generator and Rust config batch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-generator-layout.py
          cargo fmt --manifest-path src/rust/Cargo.toml --all
          cargo test --locked --manifest-path src/rust/Cargo.toml --features config --test config_adversarial
          cargo test --locked --manifest-path src/rust/Cargo.toml --features config --test config_runtime_corpus
          cargo test --locked --manifest-path src/rust/Cargo.toml --features config --test config_examples
          cargo test --locked --manifest-path src/rust/Cargo.toml --lib --features full
          git diff --check

      - name: Commit verified rollout batch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/config-rollout-batch-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/lib-core/gen_org_locks.py scripts/test-generator-layout.py src/rust/tests/config_adversarial.rs src/rust/tests/config_runtime_corpus.rs src/rust/tests/config_examples.rs contracts/lock-config/runtime-cases.json contracts/lock-config/examples contracts/lock-config/README.md .github/workflows/config-rollout-batch-repair.yml
          git diff --cached --check
          git commit -m 'feat(config): propagate .ores-lock.toml through lib-core generation'
          git push origin HEAD:config/ores-lock-v1

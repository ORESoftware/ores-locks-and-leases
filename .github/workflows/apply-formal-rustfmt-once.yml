name: apply-formal-rustfmt-once

on:
  push:
    branches:
      - DEN-2050/formal-fencing-kani
    paths:
      - formal/fencing-model/src/lib.rs
      - .github/workflows/apply-formal-rustfmt-once.yml

permissions:
  contents: write

concurrency:
  group: apply-formal-rustfmt-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-2050/formal-fencing-kani
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Apply exact formatter output and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path formal/fencing-model/Cargo.toml
          git rm -- .github/workflows/apply-formal-rustfmt-once.yml
          git add -- formal/fencing-model/src/lib.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-2050: apply pinned formal rustfmt output'
          git push origin HEAD:DEN-2050/formal-fencing-kani

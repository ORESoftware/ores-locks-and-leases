name: polyglot-governance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'conformance/**'
      - 'governance/**'
      - 'scripts/check-polyglot-governance.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/polyglot-governance.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'conformance/**'
      - 'governance/**'
      - 'scripts/check-polyglot-governance.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/polyglot-governance.yml'

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: node --check scripts/check-polyglot-governance.mjs
      - run: node scripts/check-polyglot-governance.mjs

name: adversarial-fencing

on:
  pull_request:
    paths:
      - 'scripts/generate-fence-adversarial.mjs'
      - 'scripts/test-adversarial-datastores.mjs'
      - 'scripts/test-adversarial-runtimes.mjs'
      - 'scripts/run-psql.mjs'
      - 'scripts/test-run-psql.sh'
      - 'scripts/test-all.sh'
      - 'scripts/test-persistence.sh'
      - 'src/**/fence*'
      - 'persistence/**'
      - 'docs/adversarial-fencing.md'
      - 'conformance/README.md'
      - '.github/workflows/adversarial-fencing.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/generate-fence-adversarial.mjs'
      - 'scripts/test-adversarial-datastores.mjs'
      - 'scripts/test-adversarial-runtimes.mjs'
      - 'scripts/run-psql.mjs'
      - 'scripts/test-run-psql.sh'
      - 'scripts/test-all.sh'
      - 'scripts/test-persistence.sh'
      - 'src/**/fence*'
      - 'persistence/**'
      - 'docs/adversarial-fencing.md'
      - 'conformance/README.md'
      - '.github/workflows/adversarial-fencing.yml'
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adversarial-fencing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: locks
          POSTGRES_DB: locks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: rustfmt,clippy
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '27'
          gleam-version: '1.16.0'
          rebar3-version: '3'
      - name: Install datastore clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client redis-tools
      - name: Generate and deterministically recheck the corpus
        id: corpus
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          profile=pr
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            profile=scheduled
          fi
          node --check scripts/generate-fence-adversarial.mjs
          node --check scripts/test-adversarial-datastores.mjs
          node --check scripts/test-adversarial-runtimes.mjs
          node --check scripts/run-psql.mjs
          sh scripts/test-run-psql.sh
          node scripts/generate-fence-adversarial.mjs \
            --profile "$profile" \
            --output target/adversarial/fence-decision.json \
            --receipt target/adversarial/generation-receipt.json
          node scripts/generate-fence-adversarial.mjs \
            --profile "$profile" \
            --output target/adversarial/fence-decision.json \
            --check
          cp target/adversarial/fence-decision.json \
            conformance/cases/fence-decision.json
          node -e '
            const c=require("./conformance/cases/fence-decision.json");
            const minimum=process.env.EVENT_NAME==="schedule" || process.env.EVENT_NAME==="workflow_dispatch" ? 2000 : 128;
            if(c.schema!=="ores.locks-and-leases.fence-corpus/v2" || c.generatedCaseCount<minimum || c.storeSequence.length<128) process.exit(1);
          '
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - name: Project one corpus through all five runtimes
        run: >-
          node scripts/test-adversarial-runtimes.mjs
          --corpus conformance/cases/fence-decision.json
          --receipt target/adversarial/runtime-receipt.json
      - name: PostgreSQL and Redis adversarial persistence
        env:
          ORES_LOCKS_TEST_DATABASE_URL: postgres://postgres:locks@localhost:5432/locks
          ORES_LOCKS_ADVERSARIAL_CORPUS: ${{ github.workspace }}/conformance/cases/fence-decision.json
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
        run: sh scripts/test-persistence.sh
      - name: Retain generated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adversarial-fencing-${{ steps.corpus.outputs.profile || 'unknown' }}-${{ github.sha }}
          path: |
            target/adversarial/generation-receipt.json
            target/adversarial/runtime-receipt.json
            target/adversarial/runtime-*.log
            target/adversarial/store-receipt.json
            target/adversarial/fence-decision.json
          if-no-files-found: error
          retention-days: 30

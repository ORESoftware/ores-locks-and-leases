name: apply-fence-classifier-refactor-once

on:
  push:
    branches:
      - DEN-2050/formal-fencing-kani
    paths:
      - .github/workflows/apply-fence-classifier-refactor-once.yml

permissions:
  contents: write

concurrency:
  group: apply-fence-classifier-refactor-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-2050/formal-fencing-kani
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Refactor the production branch function and its direct proof
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          fence = Path('src/rust/fence.rs')
          text = fence.read_text(encoding='utf-8')
          marker = '/// A write attempt guarded by a Fiducia fencing token.\n'
          helper = '''/// Classify already-validated fencing identities without allocating.\n///\n/// `evaluate_fence` is the validation and object-construction boundary; this\n/// function is its total branch relation and is small enough for complete\n/// bit-vector verification over every current and incoming `u64` token.\npub(crate) const fn classify_validated_fence(\n    has_current: bool,\n    current_token: u64,\n    incoming_token: u64,\n    same_operation: bool,\n    same_payload: bool,\n) -> FenceDecisionKind {\n    if !has_current || incoming_token > current_token {\n        FenceDecisionKind::Advanced\n    } else if incoming_token < current_token {\n        FenceDecisionKind::Stale\n    } else if same_operation && same_payload {\n        FenceDecisionKind::Replay\n    } else {\n        FenceDecisionKind::TokenReuse\n    }\n}\n\n'''
          if 'pub(crate) const fn classify_validated_fence' not in text:
              if marker not in text:
                  raise SystemExit('fence insertion marker not found')
              text = text.replace(marker, helper + marker, 1)

          start = text.index('pub fn evaluate_fence(\n')
          end = text.index('/// Why a fencing request cannot be evaluated.\n', start)
          replacement = '''pub fn evaluate_fence(\n    current: Option<&FenceWatermark>,\n    incoming: &FencedWriteRequest,\n) -> Result<FenceDecision, FenceValidationError> {\n    incoming.validate()?;\n\n    let (kind, current_token, previous_token) = match current {\n        None => {\n            let kind = classify_validated_fence(\n                false,\n                0,\n                incoming.fencing_token.value(),\n                true,\n                true,\n            );\n            (kind, incoming.fencing_token.clone(), None)\n        }\n        Some(current) => {\n            current.validate()?;\n            if current.tenant_scope != incoming.tenant_scope\n                || current.resource_key != incoming.resource_key\n            {\n                return Err(FenceValidationError::IdentityMismatch);\n            }\n\n            let kind = classify_validated_fence(\n                true,\n                current.fencing_token.value(),\n                incoming.fencing_token.value(),\n                current.operation_id == incoming.operation_id,\n                current.payload_sha256 == incoming.payload_sha256,\n            );\n            let current_token = if kind == FenceDecisionKind::Advanced {\n                incoming.fencing_token.clone()\n            } else {\n                current.fencing_token.clone()\n            };\n            (kind, current_token, Some(current.fencing_token.clone()))\n        }\n    };\n\n    Ok(FenceDecision {\n        kind,\n        should_apply: kind == FenceDecisionKind::Advanced,\n        incoming_token: incoming.fencing_token.clone(),\n        current_token,\n        previous_token,\n    })\n}\n\n'''
          text = text[:start] + replacement + text[end:]
          fence.write_text(text, encoding='utf-8')

          model = Path('formal/fencing-model/src/lib.rs')
          text = model.read_text(encoding='utf-8')
          import_start = text.index('    use super::fence::{\n')
          import_end = text.index('    use super::key::LockKey;\n', import_start)
          text = text[:import_start] + '''    use super::fence::{FenceDecisionKind, classify_validated_fence};\n''' + text[import_end:]

          proof_start = text.index('    #[kani::proof]\n    #[kani::unwind(96)]\n    fn production_fence_partitions_the_complete_u64_domain()')
          next_proof = text.index('    #[kani::proof]\n', proof_start + 20)
          classifier_proof = '''    #[kani::proof]\n    fn production_classifier_partitions_the_complete_u64_domain() {\n        let has_current: bool = kani::any();\n        let current_token: u64 = kani::any();\n        let incoming_token: u64 = kani::any();\n        let same_operation: bool = kani::any();\n        let same_payload: bool = kani::any();\n\n        let actual = classify_validated_fence(\n            has_current,\n            current_token,\n            incoming_token,\n            same_operation,\n            same_payload,\n        );\n        let expected = if !has_current || incoming_token > current_token {\n            FenceDecisionKind::Advanced\n        } else if incoming_token < current_token {\n            FenceDecisionKind::Stale\n        } else if same_operation && same_payload {\n            FenceDecisionKind::Replay\n        } else {\n            FenceDecisionKind::TokenReuse\n        };\n\n        assert_eq!(actual, expected);\n        assert_eq!(\n            actual == FenceDecisionKind::Advanced,\n            !has_current || incoming_token > current_token,\n        );\n    }\n\n'''
          text = text[:proof_start] + classifier_proof + text[next_proof:]

          identity_start = text.index('    #[kani::proof]\n    #[kani::unwind(96)]\n    fn resource_identity_mismatch_always_fails_closed()')
          identity_end = text.index('    fn index_of(', identity_start)
          text = text[:identity_start] + text[identity_end:]
          model.write_text(text, encoding='utf-8')

          readme = Path('formal/fencing-model/README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '- the complete `u64` current/incoming token domain and both operation/payload\n  identity bits partition exactly into `advanced`, `replay`, `stale`, and\n  `token_reuse`;',
              '- the allocation-free production classifier used by `evaluate_fence` partitions\n  the complete `u64` current/incoming token domain and both operation/payload\n  identity bits exactly into `advanced`, `replay`, `stale`, and `token_reuse`;',
          )
          readme.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path src/rust/Cargo.toml
          cargo fmt --manifest-path formal/fencing-model/Cargo.toml
          git rm -- .github/workflows/apply-fence-classifier-refactor-once.yml
          git add -- src/rust/fence.rs formal/fencing-model/src/lib.rs formal/fencing-model/README.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-2050: expose verifier-friendly production fence classifier'
          git push origin HEAD:DEN-2050/formal-fencing-kani

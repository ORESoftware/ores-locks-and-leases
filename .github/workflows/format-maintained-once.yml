name: format-maintained-once

on:
  push:
    branches:
      - feat/DEN-2050-maintained-xact-lock
    paths:
      - 'src/rust/maintained.rs'
      - 'src/dart/lib/src/maintained.dart'
      - 'src/dart/test/maintained_test.dart'
      - 'src/gleam/src/ores_locks_and_leases/maintained.gleam'
      - 'src/gleam/test/maintained_test.gleam'
      - '.github/workflows/format-maintained-once.yml'

permissions:
  contents: write

concurrency:
  group: format-maintained-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Verify exact branch head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: rustfmt

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.3'

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '27'
          gleam-version: '1.16.0'
          rebar3-version: '3'

      - name: Format and push only maintained source paths
        env:
          BRANCH: feat/DEN-2050-maintained-xact-lock
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src/rust/Cargo.toml --all
          (
            cd src/dart
            dart pub get --enforce-lockfile
            dart format lib/src/maintained.dart test/maintained_test.dart
          )
          (
            cd src/gleam
            gleam format \
              src/ores_locks_and_leases/maintained.gleam \
              test/maintained_test.gleam
          )

          paths=(
            src/rust/maintained.rs
            src/dart/lib/src/maintained.dart
            src/dart/test/maintained_test.dart
            src/gleam/src/ores_locks_and_leases/maintained.gleam
            src/gleam/test/maintained_test.gleam
          )
          git diff --check -- "${paths[@]}"
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Pinned formatters produced no maintained-source changes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'style(DEN-2050): apply pinned maintained formatters'
          git push origin "HEAD:refs/heads/$BRANCH"

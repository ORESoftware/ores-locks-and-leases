name: tmp-repair-zed-v0.1.1-asset

# One-shot release repair: package immutable v0.1.1 with pinned Zed, verify the
# expected deterministic digest, and attach only that exact asset to the
# already-existing GitHub Release. Remove this workflow after successful proof.
on:
  push:
    branches: [release/repair-zed-v0.1.1-asset-20260915]
    paths:
      - '.github/workflows/tmp-repair-zed-v0.1.1-asset.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: v0.1.1
      RELEASE_COMMIT: b73fde1a7b4ad6bc7d00d64f2c80bcb90b8040ec
      ASSET_NAME: ores-locks-and-leases-0.1.1.tar.gz
      EXPECTED_SHA256: 49d7ab3b529e3e1162e6b2df4f81da4f00a54c0782d610f5ae79c8444d75580f
      ZED_VERSION: v0.3.0
      ZED_SHA256: f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Assert immutable release commit
        run: test "$(git -C source rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Install pinned Zed CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zed.tar.gz"
          out="$RUNNER_TEMP/zed-release"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/zed-pkg/zed-cli/releases/download/${ZED_VERSION}/zed-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ZED_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$out" "$HOME/.local/bin"
          tar -xzf "$archive" -C "$out"
          zed_bin="$(find "$out" -type f -name zed -perm -111 -print -quit)"
          test -n "$zed_bin"
          install -m 0755 "$zed_bin" "$HOME/.local/bin/zed"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pack deterministic Zed artifact
        shell: bash
        run: |
          set -euo pipefail
          cd source
          zed --version
          zed validate
          zed pack
          mapfile -t artifacts < <(find . -type f -name '*.tar.gz' -print | LC_ALL=C sort)
          test "${#artifacts[@]}" -eq 1
          cp "${artifacts[0]}" "$RUNNER_TEMP/$ASSET_NAME"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/$ASSET_NAME" | sha256sum --check --strict

      - name: Upload missing GitHub release mirror asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$RUNNER_TEMP/existing"
          mkdir -p "$existing"
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir "$existing" >/dev/null 2>&1; then
            printf '%s  %s\n' "$EXPECTED_SHA256" "$existing/$ASSET_NAME" | sha256sum --check --strict
            echo 'release asset already exists with expected digest'
          else
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$ASSET_NAME" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify published release asset digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir "$verify"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$verify/$ASSET_NAME" | sha256sum --check --strict

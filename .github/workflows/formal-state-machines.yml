name: formal-state-machines

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'src/rust/fence.rs'
      - 'src/rust/plan.rs'
      - 'src/rust/lease.rs'
      - 'src/rust/coordinated.rs'
      - 'src/go/fence.go'
      - 'src/ts/src/fence.ts'
      - 'src/dart/lib/src/fence.dart'
      - 'src/gleam/src/ores_locks_and_leases/fence.gleam'
      - 'persistence/**'
      - 'conformance/cases/fence-decision.json'
      - 'conformance/cases/lock-plan.json'
      - 'scripts/check-formal-coverage.py'
      - '.github/workflows/formal-state-machines.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'src/rust/fence.rs'
      - 'src/rust/plan.rs'
      - 'src/rust/lease.rs'
      - 'src/rust/coordinated.rs'
      - 'src/go/fence.go'
      - 'src/ts/src/fence.ts'
      - 'src/dart/lib/src/fence.dart'
      - 'src/gleam/src/ores_locks_and_leases/fence.gleam'
      - 'persistence/**'
      - 'conformance/cases/fence-decision.json'
      - 'conformance/cases/lock-plan.json'
      - 'scripts/check-formal-coverage.py'
      - '.github/workflows/formal-state-machines.yml'
  schedule:
    - cron: '19 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-state-machines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate formal coverage and evidence paths
        run: python3 scripts/check-formal-coverage.py

  bounded-state-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Check model formatting
        run: cargo fmt --manifest-path formal/fencing-model/Cargo.toml -- --check
      - name: Explore every bounded two-holder crash/retry interleaving
        run: cargo test --locked --manifest-path formal/fencing-model/Cargo.toml

  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Prove the production fencing and lock-plan partition
        uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # v1
        with:
          kani-version: '0.67.0'
          command: cargo-kani
          working-directory: formal/fencing-model

name: formal-state-machines

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'src/rust/fence.rs'
      - 'src/rust/plan.rs'
      - 'src/rust/lease.rs'
      - 'src/rust/coordinated.rs'
      - 'src/rust/maintained.rs'
      - 'src/go/fence.go'
      - 'src/go/maintained.go'
      - 'src/ts/src/fence.ts'
      - 'src/ts/src/maintained.ts'
      - 'src/dart/lib/src/fence.dart'
      - 'src/dart/lib/src/maintained.dart'
      - 'src/gleam/src/ores_locks_and_leases/fence.gleam'
      - 'src/gleam/src/ores_locks_and_leases/maintained.gleam'
      - 'persistence/**'
      - 'conformance/cases/fence-decision.json'
      - 'conformance/cases/lock-plan.json'
      - 'scripts/check-formal-coverage.py'
      - '.github/workflows/formal-state-machines.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'src/rust/fence.rs'
      - 'src/rust/plan.rs'
      - 'src/rust/lease.rs'
      - 'src/rust/coordinated.rs'
      - 'src/rust/maintained.rs'
      - 'src/go/fence.go'
      - 'src/go/maintained.go'
      - 'src/ts/src/fence.ts'
      - 'src/ts/src/maintained.ts'
      - 'src/dart/lib/src/fence.dart'
      - 'src/dart/lib/src/maintained.dart'
      - 'src/gleam/src/ores_locks_and_leases/fence.gleam'
      - 'src/gleam/src/ores_locks_and_leases/maintained.gleam'
      - 'persistence/**'
      - 'conformance/cases/fence-decision.json'
      - 'conformance/cases/lock-plan.json'
      - 'scripts/check-formal-coverage.py'
      - '.github/workflows/formal-state-machines.yml'
  schedule:
    - cron: '19 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-state-machines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate formal coverage and evidence paths
        run: python3 scripts/check-formal-coverage.py

  bounded-state-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Check model formatting
        run: cargo fmt --manifest-path formal/fencing-model/Cargo.toml -- --check
      - name: Exhaustively explore the finite lock-plan matrix and two-holder crash/retry model
        run: cargo test --locked --manifest-path formal/fencing-model/Cargo.toml

  maintained-transaction-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Exhaustively verify maintained transaction commit admission
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check formal/maintained-model.mjs
          node formal/maintained-model.mjs \
            --revision "$EXPECTED_SHA" \
            --receipt target/formal-maintained/receipt.json
      - name: Retain maintained transaction model evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintained-transaction-model-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/formal-maintained/receipt.json
          if-no-files-found: error
          retention-days: 30

  kani-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Prove the production fencing classifier over the complete u64 domain
        uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # v1
        with:
          kani-version: '0.67.0'
          command: cargo-kani
          args: '--harness production_classifier_partitions_the_complete_u64_domain'
          working-directory: formal/fencing-model

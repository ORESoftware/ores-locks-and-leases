name: tmp DEN-2037 v11 finalize

on:
  push:
    branches:
      - den-2037-eleventh-order-15-20260915
    paths:
      - .github/workflows/tmp-den-2037-v11-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-2037-eleventh-order-15-20260915
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply, test, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ORESoftware
          git config user.email noreply@github.com
          node scripts/tmp-apply-v11-runtime.mjs
          npm ci --prefix src/ts --no-audit --no-fund
          npm run build --prefix src/ts
          npm test --prefix src/ts
          node scripts/check-local-file-fault-injection-eleventh-order.mjs
          rm -f scripts/tmp-apply-v11-runtime.mjs
          rm -f .github/workflows/tmp-den-2037-v11-runtime-patch.yml
          rm -f .github/workflows/tmp-den-2037-v11-finalize.yml
          git add -A
          git diff --cached --check
          git commit -m 'DEN-2037 add deterministic publication faults and ABA-safe handles'
          git push origin HEAD:den-2037-eleventh-order-15-20260915

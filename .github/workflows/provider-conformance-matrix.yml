name: provider conformance matrix

on:
  pull_request:
    paths:
      - "conformance/**"
      - "src/rust/**"
      - "src/go/**"
      - "src/ts/**"
      - "src/dart/**"
      - "src/gleam/**"
      - "managed/cloudflare-do/**"
      - "scripts/check-provider-conformance.mjs"
      - ".github/workflows/provider-conformance-matrix.yml"
  push:
    branches: [main]
    paths:
      - "conformance/**"
      - "src/**"
      - "managed/cloudflare-do/**"
      - "scripts/check-provider-conformance.mjs"
      - ".github/workflows/provider-conformance-matrix.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Verify real provider/language implementations cover the shared corpora
        run: node scripts/check-provider-conformance.mjs
      - name: Validate stale-fencing corpus remains present for every distributed backend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-provider-conformance.mjs >/dev/null
          jq -e '.providers.fiducia.requires_fencing == true and .providers.cloudflare_durable_object.requires_fencing == true' conformance/providers.v1.json
          test -s conformance/cases/fence-decision.json
          test -s conformance/cases/renewal-decision.json
          test -s conformance/cases/cancellation-race.json
